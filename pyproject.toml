[project]
name = "rocamonti-hotel-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sergio Montana", email = "sergiomontanabernal@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
rocamonti-hotel-system = "rocamonti_hotel_system:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
[tool.uv.build-backend]
module-name = "rocamonti"